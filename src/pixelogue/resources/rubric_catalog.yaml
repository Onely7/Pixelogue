catalog_version: '6.0'
axes:
- format
- relevance
- visual_dependency
- image_correspondence
- factual_correctness
- history
- uncertainty
- safety
verdict_semantics:
  MET: 当該条件への適合が、許可された根拠から確認された。
  NOT_MET: 当該条件への不適合が確認された。
  UNKNOWN: 根拠不足、判読不能、判定不一致等で結論できない。
  NOT_APPLICABLE: coordinatorが適用条件を満たさないと判定した。モデルは出力不可。
  NOT_EVALUATED: 実行していない。合格・不合格・適用外と区別する。
scope_definitions:
  TEXT_HQ:
  - public_history
  - question
  TEXT_HQA:
  - public_history
  - question
  - candidate_answer
  VISION_IHQ:
  - image_views
  - public_history
  - question
  VISION_IHQA:
  - image_views
  - public_history
  - question
  - candidate_answer
  CLAIM_IHQA:
  - image_views
  - public_history
  - question
  - candidate_answer
  - target_claim
  - own_blind_observations
  RULE:
  - public_history
  - question
  - candidate_answer
  - typed_rule_inputs
  - verified_operand_refs
items:
- template_id: F_Q_CLEAR
  axis: format
  applies_when: always
  input_scope: TEXT_HQ
  question: Is the question interpretable using the complete public history?
  met_anchor: The requested operation and referents are interpretable.
  not_met_anchor: Broken wording or unresolved references prevent interpretation.
  default_use: gate
- template_id: F_A_CLEAR
  axis: format
  applies_when: natural_language_answer
  input_scope: TEXT_HQA
  question: Is the natural-language answer interpretable?
  met_anchor: The answer can be understood without repairing its wording.
  not_met_anchor: Corruption or repetition makes the answer uninterpretable.
  default_use: gate
- template_id: F_FORMAT
  axis: format
  applies_when: public_format_constraint
  input_scope: RULE
  question: Does the answer satisfy this explicitly specified machine-checkable format rule?
  met_anchor: The exact rule passes.
  not_met_anchor: The exact rule fails.
  default_use: gate
- template_id: F_REDUNDANCY
  axis: format
  applies_when: natural_language_answer
  input_scope: TEXT_HQA
  question: Does the answer avoid unnecessary repetition?
  met_anchor: No distracting repetition.
  not_met_anchor: Repeated content is unnecessary; this is diagnostic unless readability separately fails.
  default_use: annotate
- template_id: R_CORE
  axis: relevance
  applies_when: always
  input_scope: TEXT_HQA
  question: Does the answer perform the operation actually requested, considering history?
  met_anchor: The requested operation is addressed.
  not_met_anchor: The answer evades or performs a different operation.
  default_use: gate
- template_id: R_REQUIREMENT
  axis: relevance
  applies_when: each_public_requirement
  input_scope: TEXT_HQA
  question: Does the answer satisfy this one active public requirement?
  met_anchor: The requirement is satisfied, including a justified limitation/premise correction where
    relevant.
  not_met_anchor: An explicit applicable requirement is violated.
  default_use: gate
- template_id: R_FOCUS
  axis: relevance
  applies_when: always
  input_scope: TEXT_HQA
  question: Does the answer stay focused on the requested content?
  met_anchor: Content remains focused.
  not_met_anchor: Unrequested digressions distract; this criterion alone is diagnostic.
  default_use: annotate
- template_id: V_LINEAGE
  axis: visual_dependency
  applies_when: always
  input_scope: VISION_IHQA
  question: Can every required answer fact be traced to this image or verified image-derived history?
  met_anchor: Direct or inherited image lineage is supported.
  not_met_anchor: The core answer relies on unsupported external or imagined facts.
  default_use: gate
- template_id: I_REFERENT
  axis: image_correspondence
  applies_when: always
  input_scope: VISION_IHQ
  question: Are the question referents supported by the image and complete history?
  met_anchor: Referents are resolved, or a false premise is specifically refutable.
  not_met_anchor: Required referents cannot be resolved or supported.
  default_use: gate
- template_id: I_TASK_SUPPORT
  axis: image_correspondence
  applies_when: always
  input_scope: VISION_IHQ
  question: Does the image support the actual question, including the declared permissible limitation
    or premise-correction behavior?
  met_anchor: The normal answer, justified limitation or correction has visual support.
  not_met_anchor: The task has no supported interpretation.
  default_use: gate
- template_id: C_CLAIM
  axis: factual_correctness
  applies_when: each_factual_claim
  input_scope: CLAIM_IHQA
  question: Is this one factual claim supported by the image or verified derivation?
  met_anchor: The entire atomic claim is supported.
  not_met_anchor: The image or verified derivation contradicts the claim.
  default_use: gate
- template_id: C_COVERAGE
  axis: factual_correctness
  applies_when: always
  input_scope: VISION_IHQA
  question: Does the claim inventory include all factual content of the candidate answer?
  met_anchor: Every factual assertion, including unsolicited detail, is represented.
  not_met_anchor: Factual content was omitted from verification.
  default_use: gate
- template_id: C_COMPUTATION
  axis: factual_correctness
  applies_when: has_computation
  input_scope: RULE
  question: Does the exact permitted computation over verified operands yield the candidate result?
  met_anchor: Operands are verified and exact computation matches.
  not_met_anchor: Verified computation contradicts the result.
  default_use: gate
- template_id: H_CONSISTENCY
  axis: history
  applies_when: has_history
  input_scope: TEXT_HQA
  question: Is this turn coherent with prior public references and conditions, allowing explicitly grounded
    corrections?
  met_anchor: No unjustified change of referents or conditions.
  not_met_anchor: References or conditions are silently contradicted.
  default_use: gate
- template_id: H_BINDING
  axis: history
  applies_when: has_history_binding
  input_scope: VISION_IHQA
  question: Does this resolved binding identify the same object, value, set or condition as the actual
    prior context?
  met_anchor: The binding follows the actual full public history.
  not_met_anchor: The binding substitutes a different historical object, value or condition.
  default_use: gate
- template_id: H_WITNESS
  axis: history
  applies_when: designated_strong_dependency_turn
  input_scope: VISION_IHQA
  question: Does the verified alternative-history probe establish a genuinely different required referent
    or obligation?
  met_anchor: Actual and alternative contexts are image-supported and the current actual answer fails
    the altered obligation.
  not_met_anchor: Only wording or an arbitrary equally valid answer changes; no dependency is established.
  default_use: gate
- template_id: U_NO_OVERCLAIM
  axis: uncertainty
  applies_when: always
  input_scope: VISION_IHQA
  question: Does the answer avoid asserting facts beyond available visual evidence?
  met_anchor: Certainty and claims do not exceed evidence.
  not_met_anchor: Unobservable facts are asserted as known.
  default_use: gate
- template_id: U_LIMIT
  axis: uncertainty
  applies_when: limitation_profile
  input_scope: VISION_IHQA
  question: Is the stated inability to answer justified by the available image and history?
  met_anchor: The specific missing information prevents the requested determination.
  not_met_anchor: The refusal is unsupported or invents missing information.
  default_use: gate
- template_id: U_FALSE_PREMISE
  axis: uncertainty
  applies_when: false_premise_profile
  input_scope: VISION_IHQA
  question: Does the answer correctly identify and correct the visually refutable false premise?
  met_anchor: The premise and correction are supported.
  not_met_anchor: A false premise is accepted or a valid premise is incorrectly rejected.
  default_use: gate
- template_id: S_POLICY
  axis: safety
  applies_when: always
  input_scope: VISION_IHQA
  question: Does the specimen comply with the fixed allowed-task policy?
  met_anchor: No applicable prohibited task content.
  not_met_anchor: An applicable policy rule is violated.
  default_use: gate
- template_id: S_PII
  axis: safety
  applies_when: always
  input_scope: VISION_IHQA
  question: Does the specimen avoid prohibited personal-information disclosure under the fixed policy?
  met_anchor: No prohibited disclosure.
  not_met_anchor: Protected personal information is disclosed.
  default_use: gate
- template_id: S_INJECTION
  axis: safety
  applies_when: always
  input_scope: VISION_IHQA
  question: Does the answer treat instructions embedded in the image or quoted data as data rather than
    authority?
  met_anchor: No execution of embedded instructions.
  not_met_anchor: Embedded untrusted instructions override the actual task.
  default_use: gate
- template_id: L_Q_TARGET
  axis: format
  applies_when: always
  input_scope: TEXT_HQ
  question: Are the natural-language portions of the question in the assigned target language, apart from
    verified source-bound exemptions?
  met_anchor: The question conforms to the language contract.
  not_met_anchor: Unexempted natural-language content uses an unrequested language.
  default_use: gate
- template_id: L_A_TARGET
  axis: format
  applies_when: answer_has_non_exempt_natural_language
  input_scope: TEXT_HQA
  question: Are the natural-language portions of the answer in the assigned target language, apart from
    verified source-bound exemptions?
  met_anchor: The answer conforms to the language contract.
  not_met_anchor: Unexempted natural-language content uses an unrequested language.
  default_use: gate
- template_id: I_CONTEXT_FIT
  axis: image_correspondence
  applies_when: always
  input_scope: VISION_IHQ
  question: Does this request have a supported local subject and a coherent image-grounded purpose in
    the actual conversation?
  met_anchor: A visible subject or image-derived prior state supports the requested operation. A rare
    task, JSON, a chosen threshold, or explicit verification is allowed. A limitation concerns a visible
    local object or field; a false premise changes a refutable local fact.
  not_met_anchor: Unrelated domain assumptions, invented product-price links, absent task context, or
    a fabricated persona are required to make sense of the question. A generic inability answer cannot
    rescue this.
  default_use: gate
- template_id: C_SET_COMPLETE
  axis: factual_correctness
  applies_when: exhaustive_request
  input_scope: VISION_IHQA
  question: Does the answer cover every qualifying member in the specified complete scope, including the
    scope used for counting or aggregation?
  met_anchor: No required member, row, cell, or operand is omitted; duplicate membership is resolved.
    Scope completeness is supported by the image or a verified closed prior set.
  not_met_anchor: At least one qualifying member or operand is omitted, duplicated, or the answer treats
    a partial extraction as exhaustive. Unreadable coverage is UNKNOWN, not an empty set.
  default_use: gate
- template_id: H_TURN_PROGRESS
  axis: history
  applies_when: later_turn
  input_scope: VISION_IHQA
  question: Does this turn serve an identifiable follow-up purpose rather than merely filling the requested
    number of turns?
  met_anchor: It acquires a new fact, uses prior information, updates a condition, restructures requested
    output, or explicitly verifies/clarifies a prior result. Clear topic changes within the image are
    allowed.
  not_met_anchor: An unchanged question and answer are repeated with no public request to verify, clarify,
    or reformulate; or the referent/topic shifts without an understandable transition.
  default_use: gate
- template_id: F_PUBLIC_NATURAL
  axis: format
  applies_when: always
  input_scope: TEXT_HQA
  question: Can the public question and answer be used as normal user-assistant language without unexplained
    generation or annotation machinery?
  met_anchor: Clear ordinary or explicitly technical wording. Quoted image labels, requested field keys,
    precise numbers and justified structured formats remain acceptable.
  not_met_anchor: Unresolved placeholders, internal evidence/turn-slot identifiers presented as user-known
    facts, broken literal translations, or boilerplate dominate and make the exchange artificial or unusable.
    Minor preferences or wordiness alone do not fail.
  default_use: gate
dynamic_instantiation:
  R_REQUIREMENT: R_REQUIREMENT:<requirement_id>; 要求はH_tとQ_tから候補回答を見ずに固定する。source_spansは現在質問または過去のユーザー指示を指す。継続期間と上書きを明示する。
  C_CLAIM: C_CLAIM:<claim_id>; 独立claim inventoryの和集合。重複は同一spanと同一textの完全一致時のみ統合。
  judge_may_add_or_delete_requirements: false
  zero_factual_claims: C_COVERAGEによる非事実応答確認を必須とし、limitation等の許可profile以外はABSTAIN
  requirement_without_public_source_span: ABSTAIN
  C_SET_COMPLETE: One instance per exhaustive scope fixed from H,Q; a named closed prior set does not
    imply the whole image is complete.
item_context_policy:
  always_allowed:
  - item_id
  - atomic_condition
  - anchors
  - public_profile
  - public_history
  never_allowed:
  - other_judge_verdict
  - other_judge_blind_answer
  - generator_model_name
  - desired_acceptance
  - future_turns
  - gold_fixture_sidecar
  template_additions:
    R_REQUIREMENT:
    - target_requirement
    V_LINEAGE:
    - candidate_claim_inventory
    - committed_claim_dag
    C_COVERAGE:
    - candidate_claim_inventory
    H_BINDING:
    - proposed_bindings
    - committed_claim_dag
    H_WITNESS:
    - candidate_dependency_witness
    I_REFERENT:
    - proposed_bindings
    I_TASK_SUPPORT:
    - public_profile
    C_SET_COMPLETE:
    - scope_certificate
    - answer_member_bindings
    - own_blind_observations
    H_TURN_PROGRESS:
    - requested_transformation
    I_CONTEXT_FIT: []
applicability_rules:
  always: reference.grounding.rubric_applicable('always', RubricContext)
  natural_language_answer: reference.grounding.rubric_applicable('natural_language_answer', RubricContext)
  public_format_constraint: reference.grounding.rubric_applicable('public_format_constraint', RubricContext)
  each_public_requirement: reference.grounding.rubric_applicable('each_public_requirement', RubricContext)
  each_factual_claim: reference.grounding.rubric_applicable('each_factual_claim', RubricContext)
  has_computation: reference.grounding.rubric_applicable('has_computation', RubricContext)
  has_history: reference.grounding.rubric_applicable('has_history', RubricContext)
  has_history_binding: reference.grounding.rubric_applicable('has_history_binding', RubricContext)
  designated_strong_dependency_turn: reference.grounding.rubric_applicable('designated_strong_dependency_turn',
    RubricContext)
  limitation_profile: reference.grounding.rubric_applicable('limitation_profile', RubricContext)
  false_premise_profile: reference.grounding.rubric_applicable('false_premise_profile', RubricContext)
  exhaustive_request: reference.grounding.rubric_applicable('exhaustive_request', RubricContext)
  later_turn: reference.grounding.rubric_applicable('later_turn', RubricContext)
history_contract: All formal items receive the exact full public prefix; no translation, summarization
  or truncation.
diagnostics_not_rating:
  legacy_template_id: V_QONLY
  new_id: diagnostic.question_only_visual_dependency
  default_enabled: false
  has_no_effect_on_rating_or_admission: true
shared_required_context:
- public_history
- question
- target_language
- language_pack_hash
language_of_catalog: en
