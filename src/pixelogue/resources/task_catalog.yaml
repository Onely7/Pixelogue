      - building
      - artwork
      - flag_or_emblem
      - natural_feature
  example_question: Which famous bridge is shown in this photo?
  do_not_infer: >-
    Any person's identity, a name suggested only by the question, or a guess when the visible features
    fit several places.
  answer_format: The name of the entity, followed by the visible features that identify it.
