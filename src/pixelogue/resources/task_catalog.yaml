  - multiple_entities
  - visible_attribute
  - closed_scope
  eligibility_checks:
  - scope_resolved
  - complete_scope
  - grouping_key_defined
  verification_contracts:
  - dual_visual_review
  - closed_set_check
  parameters:
    group_key:
      kind: text
      required: true
      description: The visible attribute that defines the groups, such as 'color' or 'shape'.
    return:
      kind: choice
