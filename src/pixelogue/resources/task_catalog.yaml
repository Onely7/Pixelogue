- id: quantified_claim_verification
  family: counting_and_sets
  label: Check an all, none or some claim
  status: core
  definition: >-
    The user asks whether a statement using all, none, some, exactly, at least or at most holds for a
    fully visible group of objects; the answer says whether it holds and gives the counts behind it. Use
