- id: visual_claim_verification
  family: evidence_verification
  label: Verify a claim against the image
  status: core
  definition: >-
    The user states a claim about the image and asks whether it holds, or where the image supports it;
    the answer says supported, contradicted or cannot be determined and points to the visible evidence.
    Use quantified_claim_verification for claims with all, none or some, and object_presence for whether
    an object is there.
  required_capabilities:
  - resolvable_region
  eligibility_checks:
  - scope_resolved
  - claim_public_and_local
  verification_contracts:
  - dual_visual_review
  - evidence_binding_check
  parameters:
    claim:
      kind: text
      required: true
      description: The statement being checked, as the question quotes it.
