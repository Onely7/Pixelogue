  - websight
  - screen2words
  - screenqa
- id: described_object_lookup
  family: reference_spatial
  label: Find the object that matches a description
  status: core
  definition: >-
    The user describes one object by its appearance, position or relation to other objects, such as
    'the cup right of the plate with a blue handle'; the answer says which object that is, by its name,
    label or position, or says that the description fits several objects. Use false_premise_question
    when no object fits.
  required_capabilities:
  - multiple_entities
  - discriminating_attributes
  eligibility_checks:
  - scope_resolved
  - unique_referent
  verification_contracts:
  - dual_visual_review
  parameters: {}
  example_question: Which cup is to the right of the plate and has a blue handle?
