  specialist_notation:
    label: Music, chemistry and circuit notation
    task_ids:
    - music_notation_reading
    - chemical_structure_reading
    - circuit_structure_reading
capabilities:
  visible_entity: The object asked about is visible and can be told apart from its surroundings.
  visible_attribute: The property asked about can be seen; it is not hidden or inferred.
  visible_interaction: Body pose or contact shows the action or interaction.
  scene_context: Enough of the setting is visible to say what kind of scene it is.
  multiple_facts: At least two separate visible facts are available in the requested area.
  resolvable_region: The area can be described in words without inventing a marker or coordinate.
  multiple_entities: At least two relevant objects can be told apart.
  decidable_presence: The scene is clear enough to tell whether an object of a named kind is there or not.
  discriminating_attributes: Visible features or relations single out the intended object among similar ones.
  spatial_layout: The positions needed for the relation can be read in the image.
  comparable_attributes: The same visible property can be seen on every compared object.
  explicit_mapping: A visible line, key, label or legend links the items.
  closed_scope: Every member of the group asked about is fully visible, so a complete list or count is possible.
  countable_entities: Every relevant object can be counted under one clear counting unit.
  interpretable_predicates: Each condition can be checked by looking.
  readable_text: The relevant text can be read at the image's actual resolution.
  text_fields: The labeled fields and their values can be located.
  reading_order: The reading order of the text blocks is visible or marked.
  text_object_alignment: The text can be linked to the object or region it refers to.
  readable_formula: The formula's symbols and two-dimensional structure can be read.
  readable_prose: Enough document text can be read for the requested operation.
  multiple_evidence_regions: At least two relevant parts of the same image hold evidence.
  document_layout: Document elements and their boundaries are visible.
  explicit_cross_references: Labels, keys or wording link the parts being compared.
  readable_table: The needed rows, columns and cells can be read.
  table_headers: Row and column headers, including group headers, can be read.
  multiple_tables: At least two separate tables are visible.
  table_join_keys: The tables share a visible identifier for matching rows.
  readable_chart: The chart or map supports the requested reading.
  chart_encoding: The needed axes, legend, scale type and units are visible.
  legible_values: The requested values are printed or can be estimated at the stated precision.
  ordered_series: The order along the chart's axis is visible.
  comparable_series: The series can be compared on a shared scale.
  complete_series: The whole series or set of categories asked about is visible.
  calibrated_scale: The scale's labels, tick spacing, units and pointer are visible.
  typed_operands: The numbers needed are printed, with enough context to know what they measure.
  explicit_units: The units are printed, or the values are clearly unitless.
  readable_diagram: The diagram's elements, labels and marks can be read.
  graph_nodes_edges: The diagram's boxes, connections, junctions and end points can be told apart.
  edge_directions: Arrow directions, or the absence of direction, can be seen.
  explicit_branch_conditions: The condition on each branch is printed.
  geometric_marks: The shapes, equality and angle marks, and labels are visible.
  repeated_structure: Several examples show a repeating structure.
  answer_options_visible: All answer options for the pattern are visible.
  ui_controls: The relevant buttons, fields and other controls can be located.
  ui_state_indicators: The interface shows the state asked about explicitly.
  panels_resolvable: The image contains at least two panels that can be told apart.
  visible_sequence_order: The order of the panels is numbered, marked by arrows, or otherwise clear.
  notation_context: The symbols, keys and notation the drawing uses are visible.
  rendered_layout: The visible layout can be redrawn with the allowed code under fixed rendering rules.
  box_targets: Each target is fully visible with clear edges, so a tight box can be drawn around it.
  translatable_text: The text to translate is readable and clearly separated from other text.
  recognizable_entity: >-
    A well-known landmark, building, artwork, flag or emblem is shown clearly enough to recognize.
  style_traits: Visible technique, form, ornament or layout shows a style, period or genre.
  map_geography: Coastlines, borders or a locator view show enough geography to place a region.
  explanatory_diagram: A labeled diagram, schematic or figure shows a process, structure or principle.
  standard_notation: >-
    Marks follow a standard notation, such as a music staff, a structural formula, circuit symbols or a
    statistical plot.
  printed_problem: >-
    A math problem and the numbers it needs are printed in the image or stated in the question.
eligibility_checks:
  scope_resolved: >-
    The question names an area or subject that is actually in the image (a visible object, region, text
    or the whole image), never a marker, number or coordinate the user cannot see.
  visible_category_supported: >-
    The visible features justify the category named in the answer; no guessed identities and no finer
    category than the appearance supports.
  attribute_visible: >-
    The property asked about can be seen, and it is not a hidden or sensitive personal trait.
  action_visually_supported: >-
    Body pose or contact visibly shows the action; nothing about time, intent or what happens next.
  description_claims_visible: >-
    Every statement in the description is supported by something visible in the requested area.
  summary_entails_evidence: >-
    The summary keeps the source's meaning and adds no unsupported fact.
  unique_referent: >-
    The description matches exactly one object; if several match, the question must be rewritten or the
    answer must say so.
  relation_frame_defined: >-
    The question states the viewpoint for the relation, and the relation can be judged from the image
    without measuring anything.
  complete_scope: >-
    The whole group or area asked about is visible, so a complete answer is possible; unreadable or
    cut-off parts make the question unanswerable, not empty.
  comparable_basis: >-
    The compared items use the same property, unit, scale and period.
  association_explicit: >-
    A visible line, key, label or layout links the items; being close together is not enough.
  count_unit_defined: >-
    The question makes clear what counts as one item and which items are included.
  predicates_observable: >-
    Each condition can be checked by looking, and the way the conditions combine (and, or, not) is clear.
  grouping_key_defined: >-
    The question names the grouping attribute, and every object falls into exactly one group.
  hypothetical_public: >-
    The question states the change explicitly as a hypothetical, not as something that happened.
  text_legible: >-
    The text can be read at the image's actual resolution; unreadable or cut-off text is not completed
    from guesses.
  fields_bound: >-
    Each requested field has a visible label or value area; a missing field is reported as missing,
    never invented.
  reading_order_resolved: >-
    When several text blocks are involved, their reading order is clear from columns, numbering or
    layout.
  notation_resolved: >-
    The notation (for example LaTeX, or the diagram's own symbols) is clear and all visible structure is
    kept.
  answer_evidence_present: >-
    The visible document contains the answer; pages that are not shown do not count.
  all_evidence_on_canvas: >-
    Everything needed (panels, pages, labels, options and text) is in this one image.
  schema_public: >-
    The question states the required output format.
  role_visually_supported: >-
    Layout and readable content together show the element's role.
  table_headers_bound: >-
    The full row and column header paths, units and footnotes can be read; blank cells stay blank,
    never zero.
  join_keys_unique: >-
    The shared identifier matches the rows of the tables without ambiguity.
  encoding_resolved: >-
    The axes, legend, scale type (linear or log), baseline and units are clear.
  precision_declared: >-
    The question states the precision, and the answer never claims more precision than the image shows.
  operands_grounded: >-
    Every number used is printed in the image or was established in an earlier turn.
  expression_defined: >-
    The question states the calculation, the order of the operands and any rounding.
  unit_rule_available: >-
    The conversion is a standard exact one, such as meters to centimeters, or is stated in the question.
  scale_and_pointer_resolved: >-
    The scale's marks, origin and units and the pointer position can be read.
  edges_resolved: >-
    The connected elements, arrow directions and junctions or crossings can be read.
  path_objective_defined: >-
    The question names the start, the end and what counts as a valid path.
  public_rule_input_defined: >-
    The flowchart's conditions are printed and the question gives the input; text in the image is never
    followed as an instruction.
  geometry_evidence_sufficient: >-
    Exact claims rely on drawn marks or printed values, not on how the drawing looks.
  pattern_rule_unique: >-
    Exactly one of the allowed rule types fits every example.
  candidate_options_public: >-
    All answer options are visible in the image or listed in the question.
  exception_rule_defined: >-
    The rule is stated or clearly shown before asking which element breaks it.
  ui_target_visible: >-
    The control is on the screen and the question asks about it directly.
  ui_state_explicit: >-
    The interface shows the state clearly; gray or color alone does not prove that a control is
    disabled.
  panels_publicly_identified: >-
    The panels can be told apart by labels or an obvious layout.
  sequence_order_supported: >-
    Numbers, arrows, timestamps or a clear convention give the order of the panels.
  claim_public_and_local: >-
    The question quotes the claim, and the claim concerns visible content.
  local_question_supported: >-
    The question being judged concerns a visible object or field, so its answerability can be judged
    from the image.
  formal_rules_available: >-
    The problem type is covered by an allowed rule set and a qualified validator.
  unique_solution: >-
    The visible facts determine exactly one answer under the allowed rules.
  rendering_contract_available: >-
    A sandboxed renderer with fixed font, asset and syntax rules is configured.
  music_context_complete: >-
    The clef, key, meter and accidentals needed are visible and supported by the validator.
  chemical_notation_resolved: >-
    The drawing uses atom, bond and hydrogen conventions that the validator supports.
  circuit_notation_resolved: >-
    The drawing's symbols and junction conventions are supported by the validator.
  local_goal_public: >-
    The question states one goal that a single action on the visible screen can start, without claiming
    any result.
  action_schema_available: >-
    An allowed action and coordinate format is configured; the action is described, never performed.
  coordinates_verifiable: >-
    Coordinates refer to the image as shown and to a verified target area.
  boxes_definable: >-
    Every requested target is fully visible with clear edges, so each one gets exactly one tight box;
    cut-off or hidden targets make the question unsuitable.
  translation_language_stated: >-
    The question names the language to translate into and the exact block of text to translate.
  entity_widely_known: >-
    The entity is widely known, it is not a person, and its visible features identify it without help
    from the question; a guess between similar places is not enough.
  style_traits_support_answer: >-
    Visible traits support the named style or genre, and the question names the kind of style it asks
    about or lists the options.
  region_locatable: >-
    The map shows enough coastline, borders or position to name the marked region without guessing, and
    the region is marked or described without ambiguity.
  concept_shown_by_labels: >-
    The diagram's labels or structure identify the concept or process, so the explanation rests on
    standard textbook knowledge rather than speculation.
  notation_standard_and_complete: >-
    The notation is standard for its field and every mark the answer depends on is visible.
  premise_clearly_false: >-
    What the question assumes, such as a purse carried by the woman or a black dog when the only dog is
    brown, is clearly not in the image, while the person, object or area that the question mentions is
    visible.
  presence_decidable: >-
    Whether the object asked about is there can be decided by looking: it is clearly visible, or it would
    clearly be seen if it were there; an area that is cut off, hidden, blurred or too small makes the
    question unsuitable.
  presence_not_hinted: >-
    The question does not hint whether the object asked about or assumed is there, for example by calling
    it visible, missing or usual for the scene, or by telling how to answer.
  problem_fully_given: >-
    Every number and condition the problem needs is printed in the image or stated in the question, and
    the result is one number or short expression.
  creative_brief_stated: >-
    The question states the form of the creative text and, if it matters, its length; nothing it asks
    for contradicts the image or concerns a person's identity.
verification_contracts:
  dual_visual_review:
    contract: >-
      Two independent judges each decide whether the question and the answer are correct, complete,
      supported by the image and in the requested language and format. Their agreement does not prove
      truth.
    applies_when: Always.
  closed_set_check:
    contract: >-
      Two independent readers list the members or per-group counts of the visible group, and the
      controller compares them with the answer. Duplicates, unknown members and incomplete groups stay
      explicit.
    applies_when: >-
      The answer depends on a complete list, a count, an order, or an all, none or some claim.
  exact_arithmetic_check:
    contract: >-
      Two independent readers extract the operands, and the controller recomputes the result exactly with
      the stated units and rounding. A correct calculation does not prove that the operands were read
      correctly.
    applies_when: The answer depends on a calculation or a numeric comparison.
  transcript_alignment:
    contract: >-
      Two independent readers transcribe the requested source text, and the controller compares the
      answer with it exactly, including punctuation and meaningful whitespace. Source errors are not
      corrected.
    applies_when: The answer copies or extracts visible text, code or labels.
  schema_check:
    contract: >-
      The controller checks that the answer follows the requested machine-readable format. A valid format
      does not make the content correct.
    applies_when: The question requires JSON, HTML, Markdown or another fixed format.
  formula_structure_check:
    contract: >-
      Two independent readers transcribe the formula's structure, and the controller compares symbols,
      grouping and scripts. An algebraically equivalent formula does not count as correct.
    applies_when: The answer transcribes a visible mathematical formula.
  evidence_binding_check:
    contract: >-
      Two independent reviewers link every essential part of the answer to a visible region or an exact
      quote, and check that the linked evidence agrees, without using outside facts.
    applies_when: >-
      The answer identifies or combines evidence from parts of the image or from earlier verified turns.
  table_structure_check:
    contract: >-
      Two independent readers recover the table's header paths and cells, and the controller checks the
      answer's alignment and completeness against them.
    applies_when: The answer depends on row, column or header alignment, or rebuilds a table.
  chart_encoding_check:
    contract: >-
      Two independent readers recover the axes, legend, scale and the relevant marks, and the controller
      checks the answer and its precision against them.
    applies_when: The answer depends on a chart's or map's encoding or on plotted values.
  premise_check:
    contract: >-
      Two independent readers decide, without seeing the candidate answer, whether the image shows what
      the question asks about or assumes, and the controller requires them to agree and the answer's
      conclusion to match. A reader's doubt about hidden, cut-off or very small areas leaves the turn
      uncommitted.
    applies_when: >-
      The question asks whether something is in the image, or assumes something that may not be there.
  scale_check:
    contract: >-
      Two independent readers recover the scale's labels, ticks, units and pointer, and the controller
      recomputes the reading and its tolerance.
    applies_when: The answer reads a ruler, gauge, scale or clock.
  graph_check:
    contract: >-
      Two independent readers extract the diagram's elements and connections, and the controller computes
      neighbors, paths and branch outcomes from them.
    applies_when: The answer depends on connections, directions, paths or branches.
  geometry_check:
    contract: >-
      Two independent readers extract the drawn marks and printed values; the controller never treats how
      the drawing looks as an exact fact.
    applies_when: The answer states a geometric relation or a shape property.
  pattern_check:
    contract: >-
      Two independent readers describe every panel and option, and the controller searches the allowed
      rule types, requiring exactly one fitting rule and answer.
    applies_when: The answer names a pattern rule, a completion or an exception.
  ui_grounding_check:
    contract: >-
      Two independent reviewers find the visible control that the question refers to and check the
      answer's description of it and of its location.
    applies_when: The answer locates or identifies an interface control.
  panel_comparison_check:
    contract: >-
      Two independent reviewers compare only the panels the question names and link every stated
      difference or change to those panels.
    applies_when: The answer compares panels or describes their sequence.
  formal_geometry_validator:
    contract: >-
      A specialized validator checks every visual premise and a formal derivation under an allowed set of
      theorems.
    applies_when: The geometric_constraint_solving extension is enabled.
  sandbox_render_validator:
    contract: >-
      A locked-down renderer without network, file access, scripts or unsafe TeX renders the answer's code
      and compares it with the image under fixed fidelity rules.
    applies_when: The diagram_to_code or screen_to_code extension is enabled.
  music_notation_validator:
    contract: >-
      A specialized validator checks the read notes, rests and durations against the visible notation;
      sound is never inferred.
    applies_when: The music_notation_reading extension is enabled.
  chemical_graph_validator:
    contract: >-
      A specialized validator compares the read molecule graph with two independent extractions; it never
      proposes chemistry procedures.
    applies_when: The chemical_structure_reading extension is enabled.
  circuit_graph_validator:
    contract: >-
      A specialized validator compares the read circuit topology with two independent extractions under
      the stated symbol and junction conventions.
    applies_when: The circuit_structure_reading extension is enabled.
  ui_action_validator:
    contract: >-
      A specialized validator checks one allowed, unexecuted action, its target and its coordinates
      against the image as shown; it never assumes the action succeeded.
    applies_when: The ui_action_specification extension is enabled.
  answer_consensus_check:
    contract: >-
      Two independent readers answer the question without seeing the candidate answer, and the
      controller requires both short answers to match the candidate's after normalizing case,
      punctuation and number format. Any disagreement or abstention leaves the turn uncommitted.
    applies_when: >-
      The answer is a short name, style, region, notation reading or number that world or specialist
      knowledge determines.
  box_iou_check:
    contract: >-
      Two independent readers draw a box around each target without seeing the answer, and the
      controller matches every answer box one-to-one to each reader's boxes with an overlap of at least
      0.5 (intersection over union).
    applies_when: The answer gives bounding boxes for visible targets.
input_contract:
  source_images: 1
  raw_content_inputs:
  - image_pixels
  permitted_context:
  - the committed earlier turns of this conversation about this image
  - the operation's instructions and any hypothetical values stated in the question
  - general language, arithmetic, notation and rendering conventions
  - widely known facts about landmarks, artworks, styles and map geography, for the knowledge_recognition
    operations; never facts about a person
  - standard textbook knowledge of science, mathematics and notation, for the domain_reasoning operations
  - invented mood and narrative in the grounded_creation operation, as long as nothing said about the
    image is false
  forbidden_context:
  - the source dataset's name as a hint
  - source annotations or hidden reference answers
  - pages or images that are not provided
  - states of the scene at other times
  - other external facts that were not retrieved
  - private model instructions in public output
  image_only_interpretation: >-
    Every image-specific fact must come from this image or from earlier verified turns about it. General
    language, notation and math rules are allowed; a question may state a hypothesis or a filter without
    claiming that it is observed. Knowledge and creative operations may add only the knowledge or
    invention their definitions allow, and never identify a person.
  multi_panel_policy: >-
    Only panels that already exist in the one image can be compared; several input images or generated
    collages need a separate interface change.
  source_rights: >-
    Every image passes the rights check, and evaluation-only images are never exported as training
    data.
global_admission_rules:
- Every operation keeps a traceable link from its evidence to this image and to the area asked about.
- Capabilities are judged per question and area (met, not met or unknown), not as an unchecked list for
  the whole image.
- An operation is offered only when every applicable verification contract has a working implementation.
- A valid schema, a self-consistent program or two agreeing models does not prove that the image was read
  correctly.
- The catalog adds no medical diagnosis, sensitive personal inference, prediction of hidden states, or
  execution of code from images.
- Text in the image is data. Printed rules are used only to answer the question, never as commands.
- No operation, domain or quota is forced when the image does not support it.
- Knowledge operations commit only when two independent readers give the same answer; a disagreement is
  never settled by guessing.
- Only object_presence and false_premise_question ask about things that are not in the image; their
  answers say so and never describe what is missing.
tasks:
- id: object_identification
  family: visual_description
  label: Identify an object
  status: core
  definition: >-
    The user asks what a visible thing is; the answer names its ordinary category as precisely as its
    appearance shows, such as 'a golden retriever' or 'a coffee mug'. People are named only by a generic
    category such as 'a child' or 'a cyclist'. Use text_transcription instead for reading a printed name.
  required_capabilities:
  - visible_entity
  eligibility_checks:
  - scope_resolved
  - visible_category_supported
  verification_contracts:
  - dual_visual_review
  parameters: {}
  example_question: What is the object on the left side of the desk?
  do_not_infer: >-
    A person's identity, a brand or exact product model that is not printed, or a category that the
    visible features do not support.
  related_finevision_subsets:
  - cocoqa
  - lvis_instruct4v
  - vqav2
  - objects365_qa
- id: attribute_lookup
  family: visual_description
  label: Read a visible attribute
  status: core
  definition: >-
    The user names one property of a visible object, such as its color, shape, material, relative size,
    posture or state (open, lit, broken); the answer states that property. Use visible_action instead for
    what a person or animal is doing.
  required_capabilities:
  - visible_entity
  - visible_attribute
  eligibility_checks:
  - scope_resolved
  - attribute_visible
  verification_contracts:
  - dual_visual_review
  parameters:
    attribute:
      kind: text
      required: true
      description: >-
        The property being asked about, such as 'color' or 'what is on the person's head'; never the
        property's value.
  example_question: What color is the umbrella that the woman is holding?
  do_not_infer: >-
    Feelings, intentions, health, age, real-world measurements, or any hidden or sensitive personal
    attribute.
  related_finevision_subsets:
  - coco_colors
  - cocoqa
  - lnqa
  - vqav2
- id: visible_action
  family: visual_description
  label: Describe a visible action
  status: core
  definition: >-
    The user asks what a visible person or animal is doing, or how it interacts with an object; the
    answer describes only the action or contact shown in this still image. Use attribute_lookup instead
    for posture alone and spatial_relation for where things are placed.
  required_capabilities:
  - visible_entity
  - visible_interaction
  eligibility_checks:
  - scope_resolved
  - action_visually_supported
  verification_contracts:
  - dual_visual_review
  parameters: {}
  example_question: What is the man in the red jacket doing with the rope?
  do_not_infer: >-
    What happened before or will happen next, intentions, speed, or abilities such as what an object
    could do.
  related_finevision_subsets:
  - sharegpt4v(coco)
  - LLaVA_Instruct_150K
  - vqav2
  - drivelm
- id: scene_categorization
  family: visual_description
  label: Classify the scene
  status: core
  definition: >-
    The user lists two to five distinct kinds of scene, one of which matches the image, such as
    'kitchen, office or street', and asks which one it shows; the answer picks the option that the
    visible evidence supports.
  required_capabilities:
  - scene_context
