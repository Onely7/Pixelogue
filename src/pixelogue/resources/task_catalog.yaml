  - closed_scope
  - countable_entities
  - interpretable_predicates
  eligibility_checks:
  - scope_resolved
  - complete_scope
  - count_unit_defined
  verification_contracts:
  - dual_visual_review
  - closed_set_check
  - exact_arithmetic_check
  parameters:
    count_unit:
      kind: text
      required: true
      description: What counts as one item in each group, such as 'each cup' and 'each plate'.
