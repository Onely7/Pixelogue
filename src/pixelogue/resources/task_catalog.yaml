  parameters: {}
  example_question: Give the bounding box of the red car on the left.
  do_not_infer: Boxes for hidden or cut-off parts, or for objects that only resemble the description.
  answer_format: >-
    One JSON object of the form {"boxes": [[left, top, right, bottom]]} with one box per requested
