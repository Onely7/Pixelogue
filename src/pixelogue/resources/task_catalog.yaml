capabilities:
  visible_entity: A relevant object is visibly resolvable within one bound scope.
  visible_attribute: The requested appearance or external state can be read without inference about hidden
    properties.
  visible_interaction: Pose or contact visibly supports a still-image action or interaction description.
  scene_context: Enough contextual features are visible for a broad scene account.
  multiple_facts: At least two distinct relevant visible facts can be grounded in the same scope.
  resolvable_region: A region can be publicly referred to without inventing a marker or coordinate.
  multiple_entities: At least two relevant entities are individually resolvable.
  discriminating_attributes: Visible features or relations distinguish the intended target within the
    candidate set.
  spatial_layout: Positions are readable in a declared spatial reference frame.
  comparable_attributes: The same visible property of the compared objects is observable.
  explicit_mapping: A visible key, line, label, or unambiguous encoding establishes a correspondence.
  closed_scope: The scope boundary and all relevant members are observable; this is scope-specific, not
    an image-wide guess.
  countable_entities: Every relevant visible instance can be individuated under a declared counting unit.
  interpretable_predicates: Requested membership predicates can be checked from visible facts.
  readable_text: Task-relevant text is legible in the actual model/student view.
  text_fields: Distinct labeled fields and their value regions can be resolved.
  reading_order: The reading order is visible or explicitly marked.
  text_object_alignment: Text can be linked to its depicted object or region without invented associations.
  readable_formula: Required symbols and two-dimensional formula relations are legible.
  readable_code: Required code tokens and indentation are legible.
  readable_prose: Enough readable prose is visible to support the requested document operation.
  multiple_evidence_regions: At least two relevant evidence regions are present in this same canvas.
  document_layout: Document elements and structural boundaries are visible.
  explicit_cross_references: Keys, labels, or text explicitly link the regions under comparison.
  readable_table: Required rows, columns, and cell contents are legible.
  table_headers: Column and row labels, including necessary ancestor headers, can be resolved.
  multiple_tables: At least two distinct tables are visible in the same canvas.
  table_join_keys: Explicit shared identifiers permit matching between visible tables.
  readable_chart: The chart or thematic map supports an identified chart operation.
  chart_encoding: Required axes, legend, scale type, and units are visible or explicitly resolved.
  legible_values: Requested values are labeled or estimable at a declared precision.
  ordered_series: Ordering along the relevant series axis is visible.
  comparable_series: The required series can be compared in a common compatible scale.
  complete_series: The full requested series or category set is visible.
  calibrated_scale: Scale labels, tick spacing, units, and the reading indicator are visible.
  typed_operands: The needed quantities have source bindings and enough type context; dimensionless values
    are explicitly marked.
  explicit_units: Required units are printed or dimensionless status is unambiguous.
  readable_diagram: The relevant diagram elements, labels, and markings are legible.
  graph_nodes_edges: Required nodes, edges, junctions, and endpoints can be distinguished.
  edge_directions: Edge directions or an explicitly undirected convention can be resolved.
  explicit_branch_conditions: Required branch labels and tested conditions are visible.
  geometric_marks: Relevant shape structure, equality/angle markings, or geometric labels are visible.
  repeated_structure: Several resolved examples display a potentially analyzable repeated structure.
  answer_options_visible: All choices needed for the completion question are visible within the same image.
  ui_controls: Relevant visible UI controls or fields can be individually located.
  ui_state_indicators: The requested UI state has an explicit visible indication.
  panels_resolvable: The existing image contains at least two identifiable panels.
  visible_sequence_order: The order of the panels is explicitly marked or supported by the diagram convention.
  notation_context: Necessary symbols, keys, and local notation context are present.
  rendered_layout: The visible layout can be reproduced under a bounded rendering specification.
eligibility_checks:
  scope_resolved: Bind a public region/target expression to this image; reject nonexistent markers or
    unbound targets.
  visible_category_supported: The chosen ordinary category is justified by the image; do not guess named
    identities or obscure fine-grained classes.
  attribute_visible: The requested property is visually supported and not a hidden or sensitive personal
    attribute.
  action_visually_supported: Visible pose/contact supports the description; temporal or intentional claims
    are excluded.
  description_claims_visible: Every description clause has a visible basis within scope.
  summary_entails_evidence: Compression preserves source meaning and does not introduce an ungrounded
    fact.
  unique_referent: Verify that the public reference identifies one target; if multiple match, revise the
    question or use an ambiguity profile.
  relation_frame_defined: Specify image-plane/depth frame and orientation; reject unsupported metric or
    viewpoint-invariant claims.
  complete_scope: Determine the closed universe and ensure no relevant area is cropped, hidden, or unreadable.
    Unknown is not empty.
  comparable_basis: Resolve units, scale, attribute, period, and comparison scope before comparing.
  association_explicit: A visible association establishes the link; proximity alone is insufficient.
  count_unit_defined: Fix the unit and inclusion rules, then independently count all members.
  predicates_observable: Each selection predicate has a visible truth condition; retain AND/OR/NOT scope.
  grouping_key_defined: Define the key, membership rule, and whether groups are mutually exclusive and
    exhaustive.
  hypothetical_public: Every change is explicit in public user text and clearly hypothetical, not a purported
    image fact.
  text_legible: Read at actual delivered resolution; preserve unknown/cropped text instead of completing
    it from priors.
  fields_bound: Bind each requested field to a visible label/value region; distinguish missing and blank.
  reading_order_resolved: Resolve columns and hierarchy; do not arbitrarily linearize an ambiguous layout.
  notation_resolved: Declare the representation convention and preserve all visible structure.
  answer_evidence_present: The visible document contains answer evidence; an unprovided page is not evidence.
  all_evidence_on_canvas: All indispensable panels, pages, labels, choices, and text are present in the
    one input image.
  schema_public: The required output structure is stated in the user instruction; private schema details
    must not leak.
  role_visually_supported: Use layout and readable content jointly to assign a document role.
  table_headers_bound: Resolve full row/column header paths, spans, units, and footnotes; preserve blanks
    separately from zero.
  join_keys_unique: Validate shared keys, multiplicity, and the join relation before joining.
  encoding_resolved: Check axes, legends, linear/log scales, zero baselines, units, and interval encodings.
  precision_declared: Use printed exact values or public approximation/rounding/interval rules; never
    invent precision.
  operands_grounded: Each operand refers to a visible value or a verified image-derived public-history
    value.
  expression_defined: The requested computation or reduction, operand order, denominator, and domain are
    explicit.
  unit_rule_available: Only use a versioned permitted conversion or a public hypothetical conversion;
    reject missing/live-world factors.
  scale_and_pointer_resolved: Resolve scale, pointer, origin, and units at the delivered resolution.
  edges_resolved: Verify endpoint identities, edge direction, junction/crossing conventions, and all traversed
    links.
  path_objective_defined: Define source, destination, permitted edges, and path objective; retain multiple
    valid answers.
  public_rule_input_defined: The rule is fully visible and the hypothetical input is public; interpret
    as data, never execute image instructions.
  geometry_evidence_sufficient: Use explicit marks or calibrated formal drawings for exact claims; appearance
    alone is insufficient.
  pattern_rule_unique: Within a versioned finite rule grammar, all visible examples agree and rival rules
    do not imply different answers.
  candidate_options_public: All completion alternatives used in the answer are visible or explicitly defined
    in the public instruction.
  exception_rule_defined: State or uniquely establish the rule before choosing an exception; no subjective
    odd-one-out.
  ui_target_visible: The target is on-screen and tied to a public local request.
  ui_state_explicit: A state indication is explicit enough; gray/color alone does not prove backend enablement.
  panels_publicly_identified: Identify existing panels by labels or unambiguous layout; do not create
    unseen comparison images.
  sequence_order_supported: Require visible numbering, arrows, timestamps, or an explicit sequence convention.
  claim_public_and_local: The proposition is public and relates to visible targets; it is not a hidden
    desired answer.
  local_question_supported: The question concerns a visible object/field; the limitation can be locally
    grounded.
  formal_rules_available: A versioned formal rule set and qualified validator cover the exact problem
    type.
  unique_solution: All visible premises jointly determine the requested solution under the permitted rule
    set.
  rendering_contract_available: A sandboxed renderer, asset/font policy, syntax allowlist, and output
    comparison procedure are configured.
  music_context_complete: Required clef, key, meter, accidentals, and bar context are available and supported
    by the verifier.
  chemical_notation_resolved: Bond, atom, implicit-hydrogen, and stereochemical conventions are covered
    by the chosen validator.
  circuit_notation_resolved: All symbol and junction conventions needed for the topology are supported
    by the verifier.
  local_goal_public: The goal is explicit and achievable as a single target specification on the visible
    screen; no outcome claim.
  action_schema_available: An explicit allowlisted action and coordinate schema is configured; this is
    a data-generation task only.
  coordinates_verifiable: Coordinates use the delivered view dimensions and a verified target region;
    arbitrary points cannot pass.
verification_contracts:
  dual_visual_review:
    contract: Two blind judgments of material correctness, task realization, evidence coverage, scope,
      language, and safety. Agreement is not a truth guarantee.
    applies_when: 'Always: material correctness, grounding, task realization and public requirements.'
  closed_set_check:
    contract: Independent member or per-category count extraction; preserve duplicates, unknowns, and
      closure; compare using deterministic set/count operations.
    applies_when: The requested result depends on complete member coverage, cardinality, ordering, or
      a quantified domain.
  exact_arithmetic_check:
    contract: Independently bind operands first, then recompute with decimal/rational arithmetic and explicit
      unit/rounding rules. A calculator does not validate visual extraction.
    applies_when: The public task requires arithmetic, numeric equality/order, reduction, or numeric branch
      evaluation; not merely textual matching.
  transcript_alignment:
    contract: Independently compare output text against the visible source, including punctuation and
      meaningful whitespace. Do not autocorrect source errors.
    applies_when: The output copies or extracts visible text, code or textual labels.
  schema_check:
    contract: Check the publicly requested format; a valid JSON/HTML structure does not establish factual
      correctness.
    applies_when: An explicit public machine-readable output format is required.
  formula_structure_check:
    contract: Compare two-dimensional expression structure and a sandboxed normalized rendering/parse
      where available; symbol errors cannot be repaired by algebraic equivalence.
    applies_when: The output transcribes a visible mathematical expression.
  evidence_binding_check:
    contract: Bind every essential answer part to its visible region or exact text span; check cross-reference
      consistency without importing outside facts.
    applies_when: The answer identifies or integrates evidence from image regions or verified image-derived
      history.
  table_structure_check:
    contract: Independently recover header paths and cell relationships, then check output completeness
      and alignment.
    applies_when: The task depends on row, column or header alignment, or table reconstruction.
  chart_encoding_check:
    contract: Independently validate legend/axis/scale resolution and permitted numerical precision before
      checking outputs.
    applies_when: The answer depends on chart/map encoding, scale interpretation or plotted values.
  scale_check:
    contract: Check label/pointer geometry, calibration, units, and tolerance under the delivered image
      view.
    applies_when: The answer reads a calibrated measurement, instrument, ruler or clock.
  graph_check:
    contract: Validate visual node/edge extraction independently, then compute graph relations and route
      conditions deterministically.
    applies_when: The task depends on topology, direction, paths or branches.
  geometry_check:
    contract: Check declared formal marks or approximate visual relations without turning approximate
      drawings into exact premises.
    applies_when: The answer states a geometric relation or shape property.
  pattern_check:
    contract: Enumerate the permitted finite rule grammar and verify all visible examples, counterexamples,
      and candidate solutions; defer if nonunique.
    applies_when: The task identifies a rule, completion or rule-relative exception.
  ui_grounding_check:
    contract: Independently resolve the visible UI target and public referring expression. Text-only localization
      by default.
    applies_when: The answer localizes or identifies a user interface element.
  panel_comparison_check:
    contract: Align only declared existing panels; ground every difference or sequence claim in the compared
      panels.
    applies_when: The task compares or sequences explicitly identifiable panels.
  formal_geometry_validator:
    contract: Specialized verification of all visual premises and a formal derivation under an allowlisted
      theorem set.
    applies_when: The geometric_constraint_solving extension is enabled.
  sandbox_render_validator:
    contract: Run only in a separate locked-down renderer with no network, arbitrary file access, scripts,
      or unsafe TeX; compare the rendered appearance with public fidelity criteria.
    applies_when: The diagram_to_code or screen_to_code extension is enabled.
  music_notation_validator:
    contract: Qualified notation-specific validation of symbols and context; audio is not inferred.
    applies_when: The music_notation_reading extension is enabled.
  chemical_graph_validator:
    contract: Qualified independent chemical-graph extraction and notation verification; no procedural
      chemistry generation.
    applies_when: The chemical_structure_reading extension is enabled.
  circuit_graph_validator:
    contract: Qualified independent topology extraction and validation of symbol/junction conventions.
    applies_when: The circuit_structure_reading extension is enabled.
  ui_action_validator:
    contract: Validate one allowlisted nonexecuted action, target, view, and coordinate transform; do
      not assume backend state or execution success.
    applies_when: The ui_action_specification extension is enabled.
profile_contracts:
  normal:
    eligibility: all task capability and eligibility checks are MET for the bound scope
    answer: satisfy the task at the declared precision
  limitation:
    eligible_task_ids:
    - object_identification
    - attribute_lookup
    - entity_count
    - text_transcription
    - text_field_extraction
    - document_extractive_qa
    - table_cell_lookup
    - chart_value_lookup
    - measurement_reading
    - ui_element_grounding
    eligibility: The target/field is locally visible; independently verify a specific missing/cropped/ambiguous
      evidence condition. Do not require normal answerability capabilities to be MET. Do not admit arbitrary
      unrelated questions.
    answer: state the precise limitation; retain any supported partial information and do not guess
  false_premise:
    eligible_task_ids:
    - object_identification
    - attribute_lookup
    - spatial_relation
    - entity_count
    - text_transcription
    - text_field_extraction
    - table_cell_lookup
    - chart_value_lookup
    - visual_claim_verification
    eligibility: Begin from a supported local target and a minimally changed public premise. Both judges
      must independently establish the contradiction; absence claims require closed scope, not a failed
      search.
    answer: identify and correct only the refutable premise; do not silently switch targets
facets:
  input_domain:
    values:
    - photo
    - sketch
    - document
    - table
    - chart
    - thematic_map
    - diagram
    - ui
    - math_notation
    - code_listing
    - score
    - chemical_diagram
    - circuit
    rule: Infer from image only. Domain is not a new semantic operation and must not enable an unsupported
      task.
  source_appearance:
    values:
    - printed
    - handwritten
    - stylized
    - rotated
    - low_contrast
    - dense_layout
    rule: Difficulty tags, not separate task IDs. Never degrade legibility to manufacture diversity.
  output_form:
    values:
    - short_answer
    - sentence
    - list
    - table
    - json
    - markdown
    - latex
    - static_code
    rule: Require only public output constraints. Code, coordinates, and specialized schemas have additional
      validators.
  answer_language:
    values:
    - en
    - ja
    - zh-Hans
    rule: Retain source script for verbatim OCR; target language applies to generated explanation. A requested
      translation is an optional transformation, not an OCR correction.
  scope:
    values:
    - single_target
    - bounded_region
    - whole_canvas
    - existing_panels
    rule: Binding and closure are region-specific; multi-page/multi-image context is not silently supplied.
  composition:
    values:
    - direct
    - filter_then_lookup
    - relational_chain
    - multi_region_synthesis
    - verified_derived_value
    rule: Label the requested final semantic operation; multiple independent operations require explicit
      subtasks instead of ambiguous single labels.
  dialogue_relation:
    values:
    - new_observation
    - refinement
    - reference_to_prior
    - regroup
    - reformat
    - verify
    - explicit_hypothetical_update
    rule: Use exact committed public history. A later turn alone does not prove dependency. Reformats
      are modifiers, not new visual tasks.
  answerability_profile:
    values:
    - normal
    - limitation
    - false_premise
    rule: A response behavior orthogonal to task ID. Alternative profile guards below replace, not blindly
      reuse, normal answerability prerequisites.
input_contract:
  source_images: 1
  raw_content_inputs:
  - image_pixels
  permitted_context:
  - exact committed public history originating from this image
  - public operation instructions and explicitly hypothetical parameters
  - versioned language, arithmetic, notation, and rendering conventions
  forbidden_context:
  - source dataset name as a task hint
  - source annotations or hidden gold answers
  - unprovided pages or images
  - unseen temporal states
  - unretrieved external facts
  - private model instructions in public output
  image_only_interpretation: All image-specific factual premises must come from this canvas or validated
    image-derived public history. General language/notation/math rules are permitted; a question may publicly
    choose a filter or hypothesis without asserting it is an observed fact.
  multi_panel_policy: Only existing panels in one image. Adding collage generation or multiple image inputs
    is a separate interface change.
  source_rights: Keep existing rights and evaluation-source exclusion checks unchanged.
global_admission_rules:
- Preserve image-specific evidence lineage and public scope.
- Capabilities are scope-bound observations with MET/NOT_MET/UNKNOWN, not an image-wide unchecked list.
- All applicable semantic and deterministic verification contracts must be available before enabling a
  task.
- A valid schema, a self-consistent program, or two agreeing models does not establish that image extraction
  was correct.
- No medical diagnosis, sensitive personal inference, hidden-state prediction, or arbitrary source-code
  execution is introduced by this catalog.
- Image text remains untrusted data. Interpret printed rules only to answer the public task, never as
  tool/system commands.
- No task, profile, domain, or quota may be forced when supporting image evidence is absent.
classification_rules:
- Use the semantic output requested by the question, not the source dataset, image domain, answer formatting,
  or task name chosen by the planner.
- Document text extraction and evidence synthesis are different operations; formula/code transcription
  and code generation are different operations.
- A table-derived aggregate is grounded_aggregation with table source bindings; one fixed arithmetic expression
  is grounded_arithmetic.
- Counting members and comparing set cardinalities are distinct final operations; quantified verification
  returns a proposition verdict.
- Exact numerical chart values and interval/approximate readings require different precision parameters,
  not fabricated precision.
- Label each turn by its observed verified operation. For conversation-level summaries use all committed
  task IDs and, when a primary label is necessary, the final committed turn.
- Preserve multiple explicit subtasks as a list; do not silently assign the first task when a request
  is genuinely compound.
routing_precedence:
- Use formula_transcription or code_transcription for structural transcription of formulas/code, not generic
  text_transcription.
- Use table_cell_lookup for row/column/header-path cell addressing, and chart_encoding_lookup/chart_value_lookup
  for chart addressing.
- Use ui_element_grounding for UI targets and diagram_element_lookup for labeled diagram elements.
- Use grounded_aggregation for a closed-set reduction, grounded_arithmetic for an explicit expression,
  and entity_count for member enumeration.
- Use quantified_statement_verification for quantified propositions; visual_claim_verification is for
  other visible propositions.
- Use panel_comparison for corresponding regions in explicitly distinguishable panels; attribute_comparison
  compares resolved objects.
- Use graph_path_tracing for paths, graph_connectivity for adjacency/reachability, and diagram_process_description
  for a process summary.
- Bind the requested final operation, not the answer format; genuinely independent subtasks need explicit
  composition.
- If the operation is still ambiguous, mark UNRESOLVED rather than silently substituting an easier neighboring
  task.
runtime_feasibility:
- The expected output must fit the configured response and context budget. Otherwise choose a publicly
  explicit bounded region, allocate a reviewed larger budget, or skip. Never truncate and certify completeness.
- Check eligibility using the actual model/student image resolution and record any view transformation.
  Coordinate checks must use the same view.
- An unavailable applicable validator blocks admission; a registry entry in this proposal is not a running
  implementation.
- Pattern uniqueness is relative to an explicitly versioned finite rule grammar, made public when it changes
  the task interpretation. Competing reasonable answers require abstention.
