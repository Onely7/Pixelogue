  - ai2d_merged
- id: object_box_grounding
  family: reference_spatial
  label: Give the box of an object
  status: core
  definition: >-
    The user describes one object, or every object of a stated kind, and asks for its bounding box; the
    answer gives one tight box per object as fractions of the image width and height. Use
    described_object_lookup instead to say which object a description means.
  required_capabilities:
  - box_targets
  eligibility_checks:
  - scope_resolved
  - boxes_definable
  verification_contracts:
  - dual_visual_review
