  - dual_visual_review
  - closed_set_check
  parameters:
    quantifier:
      kind: choice
      required: true
      values:
      - all
      - none
      - some
      - exactly
      - at_least
      - at_most
      description: The quantifier that the statement uses.
    condition:
      kind: text
      required: true
      description: >-
        The property that the statement tests, such as 'blue' in 'all triangles are blue', including the
