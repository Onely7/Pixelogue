  eligibility_checks:
  - scope_resolved
  - complete_scope
  verification_contracts:
  - dual_visual_review
  - closed_set_check
  parameters:
    direction:
      kind: choice
      required: true
      values:
      - left_to_right
      - right_to_left
      - top_to_bottom
      - bottom_to_top
      - nearest_to_farthest
      - farthest_to_nearest
      description: The direction of the order, as seen in the image.
  example_question: List the labeled boxes from left to right.
  do_not_infer: An order for objects that overlap or whose positions cannot be told apart.
  related_finevision_subsets:
  - spatialsense
  - clevr
  - super_clevr(mathv360k)
- id: attribute_comparison
  family: reference_spatial
  label: Compare an attribute across objects
  status: core
  definition: >-
