    Is the statement 'the box is to the left of the chair' true for this image? Point to the evidence.
  do_not_infer: A yes-or-no verdict when the evidence is missing, or facts that are not visible.
  answer_format: >-
    Supported, contradicted or cannot be determined, followed by the visible evidence: a region, a label
    or a quoted text.
  related_finevision_subsets:
