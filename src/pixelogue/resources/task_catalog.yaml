- id: answerability_assessment
  family: evidence_verification
  label: Say whether a question can be answered from the image
  status: core
  definition: >-
    The user asks whether a specific question about a visible object or field can be answered from the
    image; the answer says whether it can and, if not, whether the needed part is unreadable, cut off or
    ambiguous. Use false_premise_question instead when the question assumes something that is not in the
    image.
  required_capabilities:
  - resolvable_region
  eligibility_checks:
  - scope_resolved
  - local_question_supported
  verification_contracts:
  - dual_visual_review
  parameters:
    local_question:
      kind: text
      required: true
      description: The question whose answerability is judged, as the user asks it.
  example_question: Can the exact price be read on this cropped label? Explain what limits it.
  do_not_infer: >-
    A refusal of an answerable question, or unreadable text treated as evidence that something is absent.
  answer_format: >-
    One of answerable, unreadable, cropped or ambiguous, followed by the visible reason.
  related_finevision_subsets:
  - idk
  - vizwiz(mathv360k)
  - screenqa
- id: object_presence
  family: presence_and_premises
  label: Say whether an object is in the image
  status: core
  definition: >-
    The user asks whether an object of a named kind is in the image or a named area, such as 'Is there a
    fork on the table?'; the answer names the relevant visible objects, says whether the object asked
    about is there, and ends with yes or no. Absent objects are often ones that usually go with what is
    visible.
  required_capabilities:
  - decidable_presence
  eligibility_checks:
  - scope_resolved
  - presence_decidable
  - presence_not_hinted
  verification_contracts:
  - dual_visual_review
  - premise_check
  parameters: {}
  answer_format: >-
    First the relevant objects that are visible, then whether the object asked about is there and, if it
    is, where; end with yes or no.
  example_question: Is there a fork on the table?
  do_not_infer: >-
    A no for an object that could be hidden, cut off or too small to see, or a yes because the object
    usually goes with the scene.
  related_finevision_subsets:
  - lrv_normal(filtered)
  - sketchyvqa
  - oodvqa
  - objects365_qa
- id: false_premise_question
  family: presence_and_premises
  label: Correct a question about something that is not there
  status: core
  definition: >-
    The user asks about something that the image does not show, such as 'What color is the woman's
    purse?' when she has none, or 'How many horses are there?' in a street scene; the answer names what
    is visible, says that the assumed object or detail is absent, and ends with zero for a count or that
    the detail cannot be determined.
  required_capabilities:
  - decidable_presence
  eligibility_checks:
  - scope_resolved
  - premise_clearly_false
  - presence_decidable
  - presence_not_hinted
  verification_contracts:
  - dual_visual_review
  - premise_check
  parameters:
    asked_detail:
      kind: choice
      required: true
      values:
      - count
      - attribute
      - location
      - action
      - kind
      description: >-
        What the question asks about the assumed object: how many there are, a property such as its
        color, where it is, what it is doing, or what kind it is.
  answer_format: >-
    First the relevant objects that are visible, then that the assumed object or detail is not there,
    ending with 0 for a count or with the statement that the detail cannot be determined.
  example_question: What type of bird is sitting on the elephant's back?
  do_not_infer: >-
    Details of the missing object, a guess that it is hidden somewhere, or an absence claimed for an area
    that is cut off or too small to see.
  related_finevision_subsets:
  - idk
  - lrv_normal(filtered)
  - oodvqa
