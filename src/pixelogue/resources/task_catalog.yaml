- id: distinguishing_description
  family: reference_spatial
  label: Describe an object so it can be told apart
  status: core
  definition: >-
    The user points to one object by a visible label, color or position and asks for a short description
    that distinguishes it from the other similar objects; the answer gives features or relations that
    only that object has.
  required_capabilities:
  - multiple_entities
  - discriminating_attributes
  eligibility_checks:
  - scope_resolved
  - unique_referent
  verification_contracts:
  - dual_visual_review
  parameters: {}
  example_question: >-
    Describe the dog lying on the bench so that it cannot be confused with the other dogs.
  do_not_infer: Hidden IDs, invisible markers, or features that the other similar objects share.
  related_finevision_subsets:
  - localized_narratives
  - lvis_instruct4v
  - visual7w
- id: spatial_relation
  family: reference_spatial
  label: State where one object is relative to another
  status: core
  definition: >-
    The user asks where one visible object is relative to another, such as left of, above, in front of
    or inside; the answer states the relation from the viewpoint that the question names.
  required_capabilities:
  - multiple_entities
  - spatial_layout
  eligibility_checks:
  - scope_resolved
  - relation_frame_defined
  verification_contracts:
  - dual_visual_review
  parameters:
    frame:
      kind: choice
      required: true
      values:
      - image
      - object
      - depth
      description: >-
        The viewpoint: image means left, right, above and below as seen in the picture; object means
        relative to the named object's own front and sides; depth means nearer to or farther from the
        camera.
  example_question: As seen in the image, is the bicycle to the left or to the right of the tree?
  do_not_infer: >-
    Distances in real units, or left and right that depend on a viewpoint the question does not state.
