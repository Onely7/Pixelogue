  required_capabilities:
  - multiple_entities
  - interpretable_predicates
  - closed_scope
  eligibility_checks:
  - scope_resolved
  - complete_scope
  - predicates_observable
  verification_contracts:
  - dual_visual_review
  - closed_set_check
  parameters:
    conditions:
      kind: text
      required: true
      description: >-
        The visible conditions an object must meet, combined with and, or, not, for example 'red and not
        round'.
  example_question: Which shapes are blue but not circles?
  do_not_infer: >-
    Conditions that cannot be checked by looking, or a partial list when the area is not fully visible.
  related_finevision_subsets:
  - tallyqa
  - clevr
  - clevr_math
  - super_clevr(mathv360k)
- id: group_by_attribute
  family: counting_and_sets
  label: Group objects by an attribute
  status: core
  definition: >-
    The user asks to group all objects of a stated kind by one visible attribute, such as color; the
