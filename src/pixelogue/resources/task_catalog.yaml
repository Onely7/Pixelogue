- id: entity_count
  family: counting_and_sets
  label: Count objects
  status: core
  definition: >-
    The user asks how many objects of a stated kind are in the image or a named area; the answer gives
    the exact number, zero only when that kind is visible but none meets a stated condition. Objects can
    also be chart marks, table rows or symbols in a labeled region of a diagram. Use
    false_premise_question if that kind is absent; count_comparison compares two counts.
  required_capabilities:
  - closed_scope
  - countable_entities
  eligibility_checks:
  - scope_resolved
  - complete_scope
  - count_unit_defined
  verification_contracts:
  - dual_visual_review
  - closed_set_check
  parameters:
    count_unit:
      kind: text
      required: true
      description: >-
        What counts as one item, such as 'each apple' or 'each person, including partly hidden ones'.
  example_question: How many red cups are on the table?
  do_not_infer: >-
    Objects hidden or cut off by the frame, or a different unit than the one asked about, such as petals
    instead of flowers.
  related_finevision_subsets:
  - cocoqa
  - oodvqa
  - tallyqa
  - clevr
- id: select_by_conditions
  family: counting_and_sets
  label: List the objects that meet stated conditions
  status: core
  definition: >-
    The user states one or more visible conditions, such as color, shape, printed text or position,
