name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install the locked CPU and development environment
        run: uv sync --locked --extra cpu --group dev
      - name: Ruff lint
        run: uv run --locked ruff check --output-format github .
      - name: Ruff format
        run: uv run --locked ruff format --check .
      - name: ty
        run: uv run --locked ty check --output-format github
      - name: Tests
        run: uv run --locked pytest
      - name: Build distributions
        run: uv build
      - name: Pre-commit parity
        run: uv run --locked pre-commit run --all-files
