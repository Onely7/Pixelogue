# syncctl configuration. Edit syncctl.toml, then run `syncctl sync`.
branch = "sync"

[central]
enabled = false
# repository = "owner/project" # 未指定なら認証ユーザー / Localディレクトリ名
remote = "origin"

[ssh]
connect_timeout = 10

[worker]
backoff_initial = "5s"
backoff_max = "5m"
retry_window = "30m"
notify = true

[secrets]
paths = [
  ".env",
  "container/tokens.sh",
  "container/gdrive_export-keito_kudo_q4_dc_tohoku_ac_jp.tar",
]

# path は省略し、Local のホームからの相対パスを各Serverのホーム以下に維持する。
